<!doctype html>
<html lang="ko" data-lang="both">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>양자 농도와 열적 파장 · Quantum concentration</title>
<meta name="description" content="입자의 질량과 온도, 수밀도를 바꾸며 고전 이상기체 조건 n ≪ n_Q를 점검한다 (Blundell 21.2, 그림 21.3)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<!-- 사이트 공통 설정 (없으면 아래 기본값 사용) -->
<script src="../../site-config.js"></script>
<style>
/* =====================================================================
 * 디자인 토큰 / design tokens  (허브와 동일 + 그래프 색)
 * ===================================================================== */
:root{
  color-scheme: light;
  --bg:#f6f6f3; --surface:#fcfcfb; --surface-2:#f0efeb;
  --text:#0b0b0b; --text-2:#52514e; --muted:#7d7c76; --line:#e2e1dc; --grid:#ebeae5;
  --accent:#2a78d6; --accent-ink:#1c5cab; --accent-weak:#e6effa;
  --series-1:#2a78d6;   /* 곡선·확률 막대 */
  --series-2:#eb6834;   /* 앙상블 표본 점 */
  --radius:14px;
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#232321;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86; --line:#2f2e2b; --grid:#262624;
    --accent:#3987e5; --accent-ink:#86b6ef; --accent-weak:#1b2a3d;
    --series-1:#3987e5; --series-2:#d95926;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86; --line:#2f2e2b; --grid:#262624;
  --accent:#3987e5; --accent-ink:#86b6ef; --accent-weak:#1b2a3d;
  --series-1:#3987e5; --series-2:#d95926;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--text); font-family:var(--font); line-height:1.6; -webkit-text-size-adjust:100%}
a{color:var(--accent-ink)}
.wrap{max-width:1180px; margin:0 auto; padding:0 16px}

/* ---------- 언어 표시 규칙 / language display ---------- */
html[data-lang="ko"] .t-en, html[data-lang="en"] .t-ko{display:none}
html[data-lang="both"] .bi-inline .t-en::before{content:" · "; color:var(--muted)}
html[data-lang="both"] .bi-block .t-en{display:block; color:var(--text-2); font-size:.9em; margin-top:.2em}
html[data-lang="both"] .bi-sub .t-en{display:block; color:var(--muted); font-size:.8em; font-weight:400}
html[data-lang="both"] .bi-tight .t-en{display:block; color:var(--muted); font-size:.78em; line-height:1.3}

/* ---------- 상단 / header ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0}
.back{text-decoration:none; font-size:.9rem; color:var(--text-2)}
.back:hover{color:var(--accent-ink)}
.lang{display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:3px; background:var(--surface)}
.lang button{border:0; background:transparent; color:var(--text-2); font:inherit; font-size:.82rem; padding:5px 11px; border-radius:999px; cursor:pointer; min-height:32px}
.lang button[aria-pressed="true"]{background:var(--accent); color:#fff}
.title{padding:10px 0 16px}
.title .chip{display:inline-block; font-size:.78rem; color:var(--accent-ink); background:var(--accent-weak); padding:3px 10px; border-radius:999px; margin-bottom:8px}
.title h1{font-size:clamp(1.45rem, 4vw, 2.1rem); line-height:1.25; margin:0 0 6px}
.title p{margin:0; color:var(--text-2); max-width:820px}

/* ---------- 패널 / panels ---------- */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; min-width:0}
.panel h2{font-size:1rem; margin:0 0 8px}
.sim{display:grid; gap:14px; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); grid-template-areas:"levels plots" "controls plots"}
.p-levels{grid-area:levels} .p-controls{grid-area:controls} .p-plots{grid-area:plots}
@media (max-width:880px){
  .sim{grid-template-columns:minmax(0,1fr); grid-template-areas:"levels" "controls" "plots"}
}
#levels{width:100%; height:360px; display:block; touch-action:manipulation}
@media (max-width:600px){ #levels{height:300px} }
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:.82rem; color:var(--text-2); margin-top:6px}
.legend .key{display:inline-flex; align-items:flex-start; gap:6px}
.sw-bar{width:16px; height:8px; border-radius:2px; background:var(--series-1); margin-top:.5em; flex:none}
.sw-dot{width:9px; height:9px; border-radius:50%; background:var(--series-2); margin-top:.45em; flex:none}
.leveldef{font-size:.86rem; color:var(--text-2); margin-top:6px}

/* ---------- 조작부 / controls ---------- */
.ctl{margin:0 0 14px}
.ctl:last-child{margin-bottom:0}
.ctl-label{display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:.9rem; margin-bottom:6px}
.ctl-label output{font-variant-numeric:tabular-nums; font-weight:600; color:var(--text)}
.seg{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:4px; background:var(--surface-2); padding:4px; border-radius:10px}
.seg.two{grid-template-columns:repeat(2, minmax(0,1fr))}
.seg button{border:0; background:transparent; color:var(--text-2); font:inherit; font-size:.85rem; line-height:1.25; padding:7px 4px; border-radius:7px; cursor:pointer; min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.12); font-weight:600}
@media (max-width:420px){ .seg:not(.two){grid-template-columns:repeat(2, minmax(0,1fr))} }
input[type=range]{width:100%; accent-color:var(--accent); height:28px; margin:0}
.btns{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.btn{border:1px solid var(--line); background:var(--surface); color:var(--text); font:inherit; font-size:.86rem; padding:7px 12px; border-radius:9px; cursor:pointer; min-height:38px}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.chk{display:inline-flex; align-items:center; gap:6px; font-size:.86rem; color:var(--text-2); cursor:pointer}
button:focus-visible, input:focus-visible, summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- 그래프 / plots ---------- */
.plot{position:relative; margin-bottom:10px}
.plot:last-of-type{margin-bottom:4px}
.plot-title{font-size:.88rem; color:var(--text-2); margin:0 0 2px}
.plot canvas{width:100%; height:150px; display:block; cursor:crosshair; touch-action:pan-y}
@media (max-width:600px){ .plot canvas{height:130px} }
.tip{position:absolute; pointer-events:none; background:var(--text); color:var(--bg); font-size:.76rem; padding:4px 7px; border-radius:6px; white-space:nowrap; transform:translate(-50%, -110%); opacity:0; transition:opacity .08s; font-variant-numeric:tabular-nums}
.xcap{font-size:.8rem; color:var(--muted); margin:2px 0 0}

/* ---------- 수치 타일 / stat tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin-top:14px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; min-width:0}
.tile .lab{font-size:.78rem; color:var(--text-2); line-height:1.3}
.tile .val{font-size:1.3rem; font-weight:650; font-variant-numeric:tabular-nums; margin-top:2px; overflow-wrap:anywhere}
.tile .sub{font-size:.76rem; color:var(--muted); font-variant-numeric:tabular-nums}

/* ---------- 본문 섹션 / text sections ---------- */
.text-sec{display:grid; gap:14px; grid-template-columns:minmax(0,1fr) minmax(0,1fr); margin-top:14px}
@media (max-width:880px){ .text-sec{grid-template-columns:minmax(0,1fr)} }
.eq-main{font-size:1.1rem; overflow-x:auto; padding:4px 0}
.eq-note{font-size:.8rem; color:var(--muted); margin:0 0 10px}
.eq-no{font-size:.78rem; color:var(--muted); text-align:right}
.ctl-label.plain{display:block}
.eq-sys{overflow-x:auto; background:var(--surface-2); border-radius:10px; padding:8px 10px; margin:4px 0 10px}
.eq-list{margin:0; padding-left:1.1em; font-size:.92rem}
.eq-list li{margin:4px 0; overflow-x:auto}
.explain p{margin:0 0 8px}
.src ul, .notes ul{margin:4px 0; padding-left:1.1em; font-size:.92rem}
.src li, .notes li{margin:5px 0}
details{margin-top:12px}
summary{cursor:pointer; color:var(--text-2); font-size:.9rem}
table{border-collapse:collapse; width:100%; font-size:.86rem; font-variant-numeric:tabular-nums; margin-top:6px}
th, td{border-bottom:1px solid var(--line); padding:4px 6px; text-align:right}
th:first-child, td:first-child{text-align:left}
footer{border-top:1px solid var(--line); margin-top:24px; padding:16px 0 36px; color:var(--muted); font-size:.82rem}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

/* ---------- 공통 확장 (데모 1, 3–12) / shared extensions ---------- */
:root{ --series-3:#1baf7a; --good:#008300; --warn:#c98500; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --series-3:#199e70; --good:#3fb950; --warn:#e3a72f; } }
:root[data-theme="dark"]{ --series-3:#199e70; --good:#3fb950; --warn:#e3a72f; }
.seg.cols{grid-template-columns:repeat(var(--cols,4), minmax(0,1fr))}
@media (max-width:420px){ .seg.cols{grid-template-columns:repeat(min(var(--cols,4),2), minmax(0,1fr))} }
canvas.viz{width:100%; height:360px; display:block; touch-action:manipulation}
@media (max-width:600px){ canvas.viz{height:300px} }
canvas.viz.short{height:240px}
@media (max-width:600px){ canvas.viz.short{height:210px} }
.plot canvas.tall{height:220px}
@media (max-width:600px){ .plot canvas.tall{height:190px} }
.sw-line{width:18px; height:3px; border-radius:2px; margin-top:.6em; flex:none}
.sw-dash{width:18px; height:0; border-top:2px dashed var(--muted); margin-top:.7em; flex:none}
.verdict{display:inline-block; font-size:.82rem; font-weight:600; padding:3px 10px; border-radius:999px; margin-top:6px}
.verdict.ok{background:color-mix(in srgb, var(--good) 15%, transparent); color:var(--good)}
.verdict.no{background:color-mix(in srgb, var(--warn) 18%, transparent); color:var(--warn)}
.row2{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
.mini{font-size:.82rem; color:var(--text-2)}
.tile .sub{overflow-wrap:anywhere}

:root{ --series-4:#eda100; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --series-4:#c98500; } }
:root[data-theme="dark"]{ --series-4:#c98500; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 상단: 허브 링크 + 언어 전환 ===== -->
  <header class="topbar">
    <a class="back bi-inline" href="../../" data-i18n="back"></a>
    <div class="lang" id="langToggle" role="group" aria-label="Language">
      <button type="button" data-set-lang="ko">한국어</button>
      <button type="button" data-set-lang="en">English</button>
      <button type="button" data-set-lang="both">한·EN</button>
    </div>
  </header>

  <!-- ===== 제목 · 한 줄 요약 ===== -->
  <div class="title">
    <span class="chip bi-inline" data-i18n="chipSec"></span>
    <h1 class="bi-sub" data-i18n="title"></h1>
    <p class="bi-block" data-i18n="summary"></p>
  </div>

  <div class="sim">
    <section class="panel p-levels" aria-labelledby="hViz">
      <h2 id="hViz" class="bi-inline" data-i18n="pViz"></h2>
      <canvas id="box" class="viz" role="img" aria-label="Particles with thermal wavepackets of size lambda_th"></canvas>
      <div id="verdict"></div>
      <p class="leveldef bi-block" data-i18n="vizNote"></p>
    </section>

    <section class="panel p-controls" aria-labelledby="hCtl">
      <h2 id="hCtl" class="bi-inline" data-i18n="pControls"></h2>
      <div class="ctl">
        <div class="ctl-label plain bi-inline" data-i18n="lblPart"></div>
        <div class="seg cols" style="--cols:4" id="partSeg" role="group">
          <button type="button" class="bi-tight" data-part="e" data-i18n="pE"></button>
          <button type="button" class="bi-tight" data-part="p" data-i18n="pP"></button>
          <button type="button" data-part="N2">N₂</button>
          <button type="button" data-part="C60">C₆₀</button>
        </div>
      </div>
      <div class="ctl">
        <label class="ctl-label" for="tSlider"><span class="bi-inline" data-i18n="lblT"></span><output id="tOut"></output></label>
        <input type="range" id="tSlider" min="0" max="1000" step="1">
      </div>
      <div class="ctl">
        <label class="ctl-label" for="nSlider"><span class="bi-inline" data-i18n="lblN"></span><output id="nOut"></output></label>
        <input type="range" id="nSlider" min="0" max="1000" step="1">
      </div>
      <div class="ctl btns">
        <button type="button" class="btn bi-inline" id="presetAir" data-i18n="preAir"></button>
        <button type="button" class="btn bi-inline" id="presetMetal" data-i18n="preMetal"></button>
      </div>
    </section>

    <section class="panel p-plots" aria-labelledby="hPlots">
      <h2 id="hPlots" class="bi-inline" data-i18n="pPlots"></h2>
      <div class="plot" id="plotQ"><p class="plot-title bi-inline" data-i18n="plotQ"></p><canvas class="tall" aria-label="Quantum concentration versus temperature"></canvas><div class="tip"></div></div>
      <div class="legend" style="margin:-4px 0 8px">
        <span class="key"><span class="sw-line" style="background:var(--series-1)"></span><span class="bi-tight" data-i18n="pE"></span></span>
        <span class="key"><span class="sw-line" style="background:var(--series-2)"></span><span class="bi-tight" data-i18n="pP"></span></span>
        <span class="key"><span class="sw-line" style="background:var(--series-3)"></span>N₂</span>
        <span class="key"><span class="sw-line" style="background:var(--series-4)"></span>C₆₀</span>
        <span class="key"><span class="sw-dash"></span><span class="bi-tight" data-i18n="legN"></span></span>
      </div>
      <div class="plot" id="plotR"><p class="plot-title bi-inline" data-i18n="plotR"></p><canvas aria-label="n over nQ versus temperature"></canvas><div class="tip"></div></div>
      <p class="xcap bi-block" data-i18n="xCap"></p>
    </section>
  </div>

  <div class="tiles" aria-live="polite">
    <div class="tile"><div class="lab bi-tight" data-i18n="tileNQ"></div><div class="val" id="vNQ"></div></div>
    <div class="tile"><div class="lab bi-tight" data-i18n="tileLam"></div><div class="val" id="vLam"></div></div>
    <div class="tile"><div class="lab bi-tight" data-i18n="tileD"></div><div class="val" id="vD"></div></div>
    <div class="tile"><div class="lab bi-tight" data-i18n="tileRatio"></div><div class="val" id="vRatio"></div></div>
    <div class="tile"><div class="lab bi-tight" data-i18n="tileTstar"></div><div class="val" id="vTstar"></div></div>
  </div>

  <!-- ===== 핵심 수식 · 해설 · 교재 ===== -->
  <div class="text-sec">
    <section class="panel" aria-labelledby="hEq">
      <h2 id="hEq" class="bi-inline" data-i18n="hEq"></h2>
      <div class="eq-main">$$n_Q=\frac{1}{\hbar^3}\left(\frac{mk_BT}{2\pi}\right)^{3/2},\qquad \lambda_{th}=n_Q^{-1/3}=\frac{h}{\sqrt{2\pi mk_BT}}$$</div>
      <p class="eq-note bi-inline" data-i18n="eqMainNote"></p>
      <div class="ctl-label plain bi-inline" data-i18n="hEqMore"></div>
      <ul class="eq-list">
        <li class="bi-block" data-i18n="eq1"></li>
        <li class="bi-block" data-i18n="eq2"></li>
        <li class="bi-block" data-i18n="eq3"></li>
      </ul>
    </section>

    <section class="panel explain" aria-labelledby="hExp">
      <h2 id="hExp" class="bi-inline" data-i18n="hExplain"></h2>
      <p class="bi-block" data-i18n="explain"></p>
    </section>

    <section class="panel src" aria-labelledby="hSrc">
      <h2 id="hSrc" class="bi-inline" data-i18n="hSource"></h2>
      <ul>
        <li class="bi-block" data-i18n="src1"></li>
        <li class="bi-block" data-i18n="src2"></li>
      </ul>
    </section>
    <section class="panel notes" aria-labelledby="hNote">
      <h2 id="hNote" class="bi-inline" data-i18n="hNote"></h2>
      <ul>
        <li class="bi-block" data-i18n="note1"></li>
        <li class="bi-block" data-i18n="note2"></li>
      </ul>
    </section>
  </div>

  <footer class="bi-block" id="footer"></footer>
</div>

<script>
/* #####################################################################
 * 데모 #5  양자 농도와 열적 파장 · Quantum concentration  — 이 파일 하나로 동작합니다.
 * 구조: (1) 문구 사전 → (2) 언어 공통 코드 → (3) 물리 계산
 *       → (4) 캔버스 그래프 도구 → (5) 화면 갱신 → (6) 이벤트
 * ##################################################################### */

/* ===== (1) 문구 사전 / UI strings ===================================== */
const I18N = {
  ko: {
    chipSec: '교재 21.2절 · 그림 21.3',
    title: '양자 농도와 열적 파장',
    summary: '입자를 크기 $\\lambda_{th}$인 파속으로 보면, 파속들이 겹치지 않을 만큼 묽을 때($n\\ll n_Q$)만 고전 이상기체로 다룰 수 있다.',
    pViz: '입자와 열적 파속 (크기 $\\lambda_{th}$)',
    vizNote: '점은 평균 간격 $d=n^{-1/3}$로 놓인 입자, 둥근 영역은 지름 $\\lambda_{th}$인 파속이다. $n/n_Q=(\\lambda_{th}/d)^3$이므로 파속이 겹치기 시작하면 $n\\approx n_Q$이다.',
    okClassic: '고전 근사 성립: $n\\ll n_Q$', midClassic: '경계 영역: $n$이 $n_Q$에 가까워짐', noClassic: '양자 효과 중요: $n\\gtrsim n_Q$',
    lblPart: '입자', pE: '전자', pP: '양성자',
    lblT: '온도 $T$ (K)', lblN: '수밀도 $n$ (m$^{-3}$)',
    preAir: '공기 분자 (N₂, 300 K, $n\\approx10^{25}$)', preMetal: '금속 속 전자 (300 K, $n\\sim10^{29}$)',
    pPlots: '양자 농도와 고전 근사의 조건',
    plotQ: '$n_Q$ (m$^{-3}$) — 온도에 따라 (로그-로그, 교재 그림 21.3)',
    legN: '지금의 수밀도 $n$',
    plotR: '$n/n_Q=n\\lambda_{th}^3$ — 지금 고른 입자 (1보다 작아야 고전 근사)',
    xCap: '그래프를 누르면 그 온도로 이동한다. $\\lambda_{th}$는 $n_Q^{-1/3}$이므로 따로 축을 두지 않고 수치 칸에 적었다.',
    tileNQ: '양자 농도 $n_Q$ (m$^{-3}$)', tileLam: '열적 파장 $\\lambda_{th}$ (m)', tileD: '평균 간격 $d=n^{-1/3}$ (m)',
    tileRatio: '$n/n_Q=n\\lambda_{th}^3$', tileTstar: '$n=n_Q$가 되는 온도 $T^*$ (K)',
    eqMainNote: '교재 식 (21.17), (21.18)',
    hEqMore: '이 데모가 함께 쓰는 식',
    eq1: '$Z_1=Vn_Q=V/\\lambda_{th}^3$ — 교재 식 (21.17), (21.19)',

function bi(ko, en){
  if (ko == null) ko = en; if (en == null) en = ko;

}
function biKey(key, vars){
  const sub = (s, l) => s == null ? s : s.replace(/\{(\w+)\}/g, (m,k) => {
    const v = vars && vars[k]; return v == null ? m : (typeof v === 'object' ? v[l] : v); });
  return bi(sub(I18N.ko[key],'ko'), sub(I18N.en[key],'en'));
}

/* 분할 버튼 묶음: data-<attr> 값을 콜백으로 넘긴다 */
function segInit(id, attr, value, onChange){

/* 로그 슬라이더 (0–1000) ↔ 값 */
const logSlider = (lo, hi) => ({ to: s => lo * Math.pow(hi / lo, s / 1000), from: v => Math.round(1000 * Math.log(v / lo) / Math.log(hi / lo)) });

/* ===== (4) 캔버스 그래프 도구 / canvas plot helper ====================== */
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const supNum = n => String(n).split('').map(c => SUP[c] || c).join('');
function fmt(v, d = 3){
  if (v == null || !isFinite(v)) return '—';
  const a = Math.abs(v);
  if (a !== 0 && (a >= 1e5 || a < 1e-3)) {
    let e = Math.floor(Math.log10(a)), m = v / Math.pow(10, e);
    if (Math.abs(m) >= 9.995) { m /= 10; e += 1; }
    return `${m.toFixed(2)}×10<sup>${e}</sup>`;
  }
  return (a >= 100 ? v.toFixed(1) : a >= 10 ? v.toFixed(2) : v.toFixed(d));
}
function fmtPlain(v, d = 3){ return fmt(v, d).replace(/<sup>(.*?)<\/sup>/, (m, e) => supNum(e)); }
function niceTicks(lo, hi, n = 4){
  const span = hi - lo; if (!(span > 0)) return [lo];
  const raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n + 0.5);
  const out = []; for (let k = Math.ceil(lo / step - 1e-9); k * step <= hi + step * 1e-6 && out.length < 50; k++) out.push(+(k * step).toPrecision(12));
  return out;
}
function logTicks(lo, hi, maxN = 7){
  const a = Math.ceil(Math.log10(lo) - 1e-9), b = Math.floor(Math.log10(hi) + 1e-9);
  let step = Math.max(1, Math.ceil((b - a + 1) / maxN));
  const out = []; for (let e = a; e <= b; e += step) out.push(Math.pow(10, e));
  if (out.length < 2) { for (const m of [2, 5]) for (let e = a - 1; e <= b; e++) { const v = m * Math.pow(10, e); if (v >= lo && v <= hi) out.push(v); } out.sort((x, y) => x - y); }
  return out;
}
function tickLabel(v, log){
  if (log) { const e = Math.log10(v); if (Math.abs(e - Math.round(e)) < 1e-9) { const k = Math.round(e); return (k >= -2 && k <= 3) ? String(+v.toPrecision(3)) : '10' + supNum(k); } return String(+v.toPrecision(2)); }
  const a = Math.abs(v); if (a !== 0 && (a >= 1e5 || a < 1e-3)) { const e = Math.floor(Math.log10(a)); return (v / Math.pow(10, e)).toFixed(1).replace(/\.0$/, '') + '×10' + supNum(e); }
  return String(+v.toFixed(6));
}
function setupCanvas(cv){
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const W = Math.max(1, Math.round(r.width)), H = Math.max(1, Math.round(r.height));
  if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = '11px ' + css('--font');
  return { ctx, W, H };
}
const colorOf = c => (c && c.startsWith('--')) ? css(c) : (c || css('--series-1'));

/* 선 그래프: 여러 계열, 로그 축, 극한값 점선, 표시점, 십자선 툴팁, 눌러서 값 고르기 */
class Plot {
  constructor(wrap, onPick){
    this.wrap = typeof wrap === 'string' ? document.getElementById(wrap) : wrap;
    this.cv = this.wrap.querySelector('canvas'); this.tip = this.wrap.querySelector('.tip');
    this.onPick = onPick; this.hoverX = null;
    this.pad = { l:48, r:14, t:8, b:20 };
    this.cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { this.hoverX = this.pxToX(e.offsetX); this.draw(); } });
    this.cv.addEventListener('pointerleave', () => { this.hoverX = null; this.draw(); });
    this.cv.addEventListener('click', e => { const x = this.pxToX(e.offsetX); if (x != null && this.onPick) this.onPick(x); });
  }
  set(d){ this.d = d; this.draw(); }
  fx(x){ const d = this.d; return d.xLog ? (Math.log(x) - Math.log(d.xMin)) / (Math.log(d.xMax) - Math.log(d.xMin)) : (x - d.xMin) / (d.xMax - d.xMin); }
  fy(y){ const d = this.d; return d.yLog ? (Math.log(y) - Math.log(d.yMin)) / (Math.log(d.yMax) - Math.log(d.yMin)) : (y - d.yMin) / (d.yMax - d.yMin); }
  xToPx(x){ return this.pad.l + this.fx(x) * (this.W - this.pad.l - this.pad.r); }
  yToPx(y){ return this.pad.t + (1 - this.fy(y)) * (this.H - this.pad.t - this.pad.b); }
  pxToX(px){ if (!this.d) return null; const d = this.d, f = (px - this.pad.l) / (this.W - this.pad.l - this.pad.r);
    if (f < 0 || f > 1) return null;
    return d.xLog ? Math.exp(Math.log(d.xMin) + f * (Math.log(d.xMax) - Math.log(d.xMin))) : d.xMin + f * (d.xMax - d.xMin); }
  ok(x, y){ const d = this.d; return isFinite(x) && isFinite(y) && !(d.xLog && x <= 0) && !(d.yLog && y <= 0); }
  draw(){
    if (!this.d) return;
    const { ctx, W, H } = setupCanvas(this.cv); this.W = W; this.H = H;
    const d = this.d, p = this.pad;
    const cGrid = css('--grid'), cMuted = css('--muted'), cText2 = css('--text-2'), cSurf = css('--surface');
    ctx.clearRect(0, 0, W, H);
    /* 격자·눈금 */
    ctx.lineWidth = 1; ctx.strokeStyle = cGrid; ctx.fillStyle = cMuted; ctx.textBaseline = 'middle';
    const yt = d.yTicks || (d.yLog ? logTicks(d.yMin, d.yMax, 5) : niceTicks(d.yMin, d.yMax, 3));
    for (const y of yt) { if (y < d.yMin || y > d.yMax) continue;
      const py = Math.round(this.yToPx(y)) + .5; ctx.beginPath(); ctx.moveTo(p.l, py); ctx.lineTo(W - p.r, py); ctx.stroke();
      ctx.textAlign = 'right'; ctx.fillText(d.yFmt ? d.yFmt(y) : tickLabel(y, d.yLog), p.l - 6, py); }
    const xt = d.xTicks || (d.xLog ? logTicks(d.xMin, d.xMax, 7) : niceTicks(d.xMin, d.xMax, 5));
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (const x of xt) { if (x < d.xMin * (d.xLog ? 0.999 : 1) - 1e-12 || x > d.xMax * 1.001 + 1e-12) continue;
      const px = Math.round(this.xToPx(x)) + .5; ctx.beginPath(); ctx.moveTo(px, p.t); ctx.lineTo(px, H - p.b); ctx.stroke();
      ctx.fillText(d.xFmt ? d.xFmt(x) : tickLabel(x, d.xLog), px, H - p.b + 4); }
    ctx.save(); ctx.beginPath(); ctx.rect(p.l, p.t, W - p.l - p.r, H - p.t - p.b); ctx.clip();
    /* 띠 (예: 가시광 영역) */
    for (const b of (d.bands || [])) { ctx.fillStyle = colorOf(b.color); ctx.globalAlpha = b.alpha || .08;
      const x0 = this.xToPx(b.x0), x1 = this.xToPx(b.x1); ctx.fillRect(Math.min(x0, x1), p.t, Math.abs(x1 - x0), H - p.t - p.b); ctx.globalAlpha = 1; }
    /* 극한값·기준 점선 */
    ctx.setLineDash([4, 4]); ctx.strokeStyle = cMuted; ctx.lineWidth = 1.2;
    for (const r of (d.refs || [])) {
      ctx.beginPath();
      if (r.fn) { let started = false; for (let i = 0; i <= 160; i++) { const x = d.xLog ? d.xMin * Math.pow(d.xMax / d.xMin, i / 160) : d.xMin + (d.xMax - d.xMin) * i / 160;
          const y = r.fn(x); if (!this.ok(x, y)) { started = false; continue; } const px = this.xToPx(x), py = this.yToPx(y); started ? ctx.lineTo(px, py) : ctx.moveTo(px, py); started = true; } }
      else if (r.x != null) { const px = this.xToPx(r.x); ctx.moveTo(px, p.t); ctx.lineTo(px, H - p.b); }
      else { const py = this.yToPx(r.y); ctx.moveTo(p.l, py); ctx.lineTo(W - p.r, py); }
      ctx.stroke();
    }
    ctx.setLineDash([]);
    /* 계열 */
    for (const s of d.series) {
      const col = colorOf(s.color);
      if (s.bars) { ctx.fillStyle = col; ctx.globalAlpha = s.alpha || .35; const y0 = this.yToPx(Math.max(d.yMin, 0));
        for (let i = 0; i < s.xs.length; i++) { if (!this.ok(s.xs[i], s.ys[i])) continue;
          const xa = this.xToPx(s.xs[i] - s.w / 2), xb = this.xToPx(s.xs[i] + s.w / 2), py = this.yToPx(s.ys[i]);
          ctx.fillRect(xa + 1, Math.min(py, y0), Math.max(1, xb - xa - 2), Math.abs(y0 - py)); }
        ctx.globalAlpha = 1; continue; }
      if (s.pts) { for (let i = 0; i < s.xs.length; i++) { if (!this.ok(s.xs[i], s.ys[i])) continue;
          ctx.beginPath(); ctx.arc(this.xToPx(s.xs[i]), this.yToPx(s.ys[i]), s.r || 4, 0, 2 * Math.PI); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = cSurf; ctx.stroke(); }
        continue; }
      ctx.strokeStyle = col; ctx.lineWidth = s.width || 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      if (s.dash) ctx.setLineDash(s.dash);
      ctx.beginPath(); let started = false;
      for (let i = 0; i < s.xs.length; i++) { const x = s.xs[i], y = s.ys[i];
        if (!this.ok(x, y)) { started = false; continue; }
        const px = this.xToPx(x), py = Math.max(-1e4, Math.min(1e4, this.yToPx(y)));
        started ? ctx.lineTo(px, py) : ctx.moveTo(px, py); started = true; }
      ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.restore();
    /* 기준선 라벨 (텍스트 색) */
    ctx.fillStyle = cText2; ctx.textBaseline = 'bottom';
    for (const r of (d.refs || [])) { if (!r.lab) continue;
      if (r.x != null) { if (r.x >= d.xMin && r.x <= d.xMax) { ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText(r.lab, this.xToPx(r.x) + 3, p.t + 1); ctx.textBaseline = 'bottom'; } continue; }
      const xr = r.labX != null ? r.labX : d.xMax, yr = r.fn ? r.fn(xr) : r.y;
      if (this.ok(xr, yr) && yr >= d.yMin && yr <= d.yMax) { ctx.textAlign = 'right'; ctx.fillText(r.lab, Math.min(W - p.r - 2, this.xToPx(xr) - 2), this.yToPx(yr) - 2); } }
    /* 직접 라벨 */
    for (const l of (d.labels || [])) { if (!this.ok(l.x, l.y)) continue; ctx.textAlign = l.align || 'left'; ctx.fillText(l.text, this.xToPx(l.x) + (l.dx || 4), this.yToPx(l.y) + (l.dy || -2)); }
    /* 표시점 */
    for (const m of (d.markers || [])) {
      if (!this.ok(m.x, m.y) || m.x < d.xMin || m.x > d.xMax) continue;
      const px = this.xToPx(m.x), py = Math.max(p.t, Math.min(H - p.b, this.yToPx(m.y))), col = colorOf(m.color);
      if (m.vline !== false) { ctx.strokeStyle = col; ctx.globalAlpha = .35; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(px, p.t); ctx.lineTo(px, H - p.b); ctx.stroke(); ctx.globalAlpha = 1; }
      ctx.beginPath(); ctx.arc(px, py, 5, 0, 2 * Math.PI); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = cSurf; ctx.stroke();
    }
    /* 마우스 십자선 + 툴팁 */
    if (this.hoverX != null && d.tip) {
      const px = this.xToPx(this.hoverX);
      ctx.strokeStyle = cMuted; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(px + .5, p.t); ctx.lineTo(px + .5, H - p.b); ctx.stroke();
      const t = d.tip(this.hoverX);
      if (t) { this.tip.textContent = t; this.tip.style.left = Math.min(Math.max(px, 110), W - 110) + 'px'; this.tip.style.top = (this.cv.offsetTop + 30) + 'px'; this.tip.style.opacity = 1; }
    } else if (this.tip) this.tip.style.opacity = 0;
  }
}
/* 데이터 범위 + 여백 */
function extent(arrs, extra = [], padFrac = 0.08){
  let lo = Infinity, hi = -Infinity;
  for (const a of arrs) for (const v of a) if (isFinite(v)) { if (v < lo) lo = v; if (v > hi) hi = v; }
  for (const v of extra) if (isFinite(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  const pd = (hi - lo) * padFrac || Math.abs(hi) * 0.1 || 0.1; return [lo - pd, hi + pd];
}
/* 적분 (심프슨) / Simpson integration */
function simpson(f, a, b, n = 400){ if (n % 2) n++; const h = (b - a) / n; let s = f(a) + f(b);
  for (let i = 1; i < n; i++) s += (i % 2 ? 4 : 2) * f(a + i * h); return s * h / 3; }
/* ln Γ(x) (Lanczos, x > 0) */
function lnGamma(x){
  const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (x < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * x))) - lnGamma(1 - x);
  x -= 1; let a = c[0]; const t = x + g + 0.5; for (let i = 1; i < g + 2; i++) a += c[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}
/* 물리 상수 (CODATA, SI) */
const PHYS = { kB:1.380649e-23, h:6.62607015e-34, hbar:1.054571817e-34, c:2.99792458e8, e:1.602176634e-19,
  NA:6.02214076e23, R:8.314462618, me:9.1093837015e-31, mp:1.67262192369e-27, u:1.66053906660e-27, muB:9.2740100783e-24, mu0:1.25663706212e-6 };
PHYS.sigma = Math.PI ** 2 * PHYS.kB ** 4 / (60 * PHYS.c ** 2 * PHYS.hbar ** 3);
let __rz; window.addEventListener('resize', () => { clearTimeout(__rz); __rz = setTimeout(() => window.onRedraw && window.onRedraw(), 80); });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => window.onRedraw && window.onRedraw());


/* ===== (3) 물리 계산 / physics ======================================= *
 * n_Q = (m k_B T / 2πħ²)^{3/2},  λ_th = h / √(2π m k_B T) = n_Q^{-1/3}  (SI)
 * 질량: CODATA (m_e, m_p), N₂ = 28.014 u, C₆₀ = 60 × 12.011 u                              */
const MASS = { e:PHYS.me, p:PHYS.mp, N2:28.014 * PHYS.u, C60:720.66 * PHYS.u };
const COLOR = { e:'--series-1', p:'--series-2', N2:'--series-3', C60:'--series-4' };
const nQ = (m, T) => Math.pow(m * PHYS.kB * T / (2 * Math.PI * PHYS.hbar ** 2), 1.5);
const lamTh = (m, T) => PHYS.h / Math.sqrt(2 * Math.PI * m * PHYS.kB * T);
const Tstar = (m, n) => 2 * Math.PI * PHYS.hbar ** 2 / (m * PHYS.kB) * Math.pow(n, 2 / 3);

/* ===== (5) 상태와 화면 갱신 ========================================== */
const tMap = logSlider(1e-6, 1e6), nMap = logSlider(1e15, 1e35);
const S = { part:'N2', T:300, n:1e25 };
let plots;
/* 고정 무작위 배치 (흔들림) */
const JIT = Array.from({length:36}, () => [Math.random() - .5, Math.random() - .5]);
function drawBox(){
  const cv = document.getElementById('box'), { ctx, W, H } = setupCanvas(cv);
  ctx.clearRect(0, 0, W, H);
  const m = MASS[S.part], ratio = S.n / nQ(m, S.T), lamOverD = Math.cbrt(ratio);   // λ/d
  const side = Math.min(W, H) - 20, x0 = (W - side) / 2, y0 = (H - side) / 2, cell = side / 6;
  ctx.strokeStyle = css('--line'); ctx.lineWidth = 1.5; ctx.strokeRect(x0, y0, side, side);
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, side, side); ctx.clip();
  const col = css(COLOR[S.part]), rPk = Math.min(side, 0.5 * lamOverD * cell);
  ctx.fillStyle = col; ctx.globalAlpha = 0.18;
  JIT.forEach(([jx, jy], i) => { const cx = x0 + (i % 6 + .5 + .35 * jx) * cell, cy = y0 + (Math.floor(i / 6) + .5 + .35 * jy) * cell;
    ctx.beginPath(); ctx.arc(cx, cy, Math.max(rPk, 1), 0, 2 * Math.PI); ctx.fill(); });
  ctx.globalAlpha = 1;
  JIT.forEach(([jx, jy], i) => { const cx = x0 + (i % 6 + .5 + .35 * jx) * cell, cy = y0 + (Math.floor(i / 6) + .5 + .35 * jy) * cell;
    ctx.beginPath(); ctx.arc(cx, cy, 3, 0, 2 * Math.PI); ctx.fillStyle = col; ctx.fill(); });
  ctx.restore();
  ctx.fillStyle = css('--text-2'); ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(`λ_th / d = ${fmtPlain(lamOverD, 3)}`, x0 + 4, y0 + 4);
}
function render(){
  const m = MASS[S.part], q = nQ(m, S.T), ratio = S.n / q;
  drawBox();
  const cls = ratio < 0.01 ? ['ok', 'okClassic'] : ratio < 1 ? ['no', 'midClassic'] : ['no', 'noClassic'];
  setHTML('verdict', `<span class="verdict ${cls[0]} bi-inline">${biKey(cls[1])}</span>`);
  const Ts = Array.from({length:121}, (_, i) => Math.pow(10, -6 + 12 * i / 120));
  plots.Q.set({ xMin:1e-6, xMax:1e6, xLog:true, yMin:1e12, yMax:1e40, yLog:true, yTicks:[1e15, 1e20, 1e25, 1e30, 1e35, 1e40],
    series:Object.keys(MASS).map(k => ({ xs:Ts, ys:Ts.map(T => nQ(MASS[k], T)), color:COLOR[k], width:k === S.part ? 2.5 : 1.5 })),
    refs:[{ y:S.n, lab:'n' }, { x:300, lab:'300 K' }],
    markers:[{ x:S.T, y:q, color:COLOR[S.part] }],
    tip: T => `T = ${fmtPlain(T)} K  n_Q: e ${fmtPlain(nQ(MASS.e, T))}, p ${fmtPlain(nQ(MASS.p, T))}, N₂ ${fmtPlain(nQ(MASS.N2, T))}, C₆₀ ${fmtPlain(nQ(MASS.C60, T))}` });
  const rs = Ts.map(T => S.n / nQ(m, T));
  plots.R.set({ xMin:1e-6, xMax:1e6, xLog:true, yMin:1e-15, yMax:1e15, yLog:true, yTicks:[1e-15, 1e-10, 1e-5, 1, 1e5, 1e10, 1e15],
    series:[{ xs:Ts, ys:rs, color:COLOR[S.part] }], refs:[{ y:1, lab:'n = n_Q' }, { x:Tstar(m, S.n), lab:'T*' }],
    markers:[{ x:S.T, y:ratio, color:COLOR[S.part] }],
    tip: T => `T = ${fmtPlain(T)} K  n/n_Q = ${fmtPlain(S.n / nQ(m, T))}` });
  document.getElementById('vNQ').innerHTML = fmt(q);
  document.getElementById('vLam').innerHTML = fmt(lamTh(m, S.T));
  document.getElementById('vD').innerHTML = fmt(Math.pow(S.n, -1 / 3));
  document.getElementById('vRatio').innerHTML = fmt(ratio);
  document.getElementById('vTstar').innerHTML = fmt(Tstar(m, S.n));
  document.getElementById('tOut').textContent = fmtPlain(S.T, 3);
  document.getElementById('nOut').textContent = fmtPlain(S.n, 2);
}
window.onRedraw = render;

/* ===== (6) 이벤트 ================================================== */
function init(){
  initPage(render);
  const tS = document.getElementById('tSlider'), nS = document.getElementById('nSlider');
  const sync = () => { tS.value = tMap.from(S.T); nS.value = nMap.from(S.n); mark(S.part); render(); };
  const setT = T => { S.T = Math.min(1e6, Math.max(1e-6, T)); sync(); };
  plots = { Q:new Plot('plotQ', setT), R:new Plot('plotR', setT) };
  tS.addEventListener('input', () => { S.T = tMap.to(+tS.value); render(); });
  nS.addEventListener('input', () => { S.n = nMap.to(+nS.value); render(); });
  const mark = segInit('partSeg', 'part', S.part, v => { S.part = v; render(); });
  document.getElementById('presetAir').addEventListener('click', () => { S.part = 'N2'; S.T = 300; S.n = 1e25; sync(); });
  document.getElementById('presetMetal').addEventListener('click', () => { S.part = 'e'; S.T = 300; S.n = 1e29; sync(); });
  sync();
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
