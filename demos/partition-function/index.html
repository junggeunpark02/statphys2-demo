<!doctype html>
<html lang="ko" data-lang="both">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>분배함수: 네 가지 계 · Partition function</title>
<meta name="description" content="2준위계, 조화진동자, N준위계, 회전자의 분배함수와 U, S, C_V (Blundell 20.1–20.3)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<!-- 사이트 공통 설정 (없으면 아래 FALLBACK 사용) -->
<script src="../../site-config.js"></script>
<style>
/* =====================================================================
 * 디자인 토큰 / design tokens  (허브와 동일 + 그래프 색)
 * ===================================================================== */
:root{
  color-scheme: light;
  --bg:#f6f6f3; --surface:#fcfcfb; --surface-2:#f0efeb;
  --text:#0b0b0b; --text-2:#52514e; --muted:#7d7c76; --line:#e2e1dc; --grid:#ebeae5;
  --accent:#2a78d6; --accent-ink:#1c5cab; --accent-weak:#e6effa;
  --series-1:#2a78d6;   /* 곡선·확률 막대 */
  --series-2:#eb6834;   /* 앙상블 표본 점 */
  --radius:14px;
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#232321;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86; --line:#2f2e2b; --grid:#262624;
    --accent:#3987e5; --accent-ink:#86b6ef; --accent-weak:#1b2a3d;
    --series-1:#3987e5; --series-2:#d95926;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86; --line:#2f2e2b; --grid:#262624;
  --accent:#3987e5; --accent-ink:#86b6ef; --accent-weak:#1b2a3d;
  --series-1:#3987e5; --series-2:#d95926;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--text); font-family:var(--font); line-height:1.6; -webkit-text-size-adjust:100%}
a{color:var(--accent-ink)}
.wrap{max-width:1180px; margin:0 auto; padding:0 16px}

/* ---------- 언어 표시 규칙 / language display ---------- */
html[data-lang="ko"] .t-en, html[data-lang="en"] .t-ko{display:none}
html[data-lang="both"] .bi-inline .t-en::before{content:" · "; color:var(--muted)}
html[data-lang="both"] .bi-block .t-en{display:block; color:var(--text-2); font-size:.9em; margin-top:.2em}
html[data-lang="both"] .bi-sub .t-en{display:block; color:var(--muted); font-size:.8em; font-weight:400}
html[data-lang="both"] .bi-tight .t-en{display:block; color:var(--muted); font-size:.78em; line-height:1.3}

/* ---------- 상단 / header ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0}
.back{text-decoration:none; font-size:.9rem; color:var(--text-2)}
.back:hover{color:var(--accent-ink)}
.lang{display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:3px; background:var(--surface)}
.lang button{border:0; background:transparent; color:var(--text-2); font:inherit; font-size:.82rem; padding:5px 11px; border-radius:999px; cursor:pointer; min-height:32px}
.lang button[aria-pressed="true"]{background:var(--accent); color:#fff}
.title{padding:10px 0 16px}
.title .chip{display:inline-block; font-size:.78rem; color:var(--accent-ink); background:var(--accent-weak); padding:3px 10px; border-radius:999px; margin-bottom:8px}
.title h1{font-size:clamp(1.45rem, 4vw, 2.1rem); line-height:1.25; margin:0 0 6px}
.title p{margin:0; color:var(--text-2); max-width:820px}

/* ---------- 패널 / panels ---------- */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; min-width:0}
.panel h2{font-size:1rem; margin:0 0 8px}
.sim{display:grid; gap:14px; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); grid-template-areas:"levels plots" "controls plots"}
.p-levels{grid-area:levels} .p-controls{grid-area:controls} .p-plots{grid-area:plots}
@media (max-width:880px){
  .sim{grid-template-columns:minmax(0,1fr); grid-template-areas:"levels" "controls" "plots"}
}
#levels{width:100%; height:360px; display:block; touch-action:manipulation}
@media (max-width:600px){ #levels{height:300px} }
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:.82rem; color:var(--text-2); margin-top:6px}
.legend .key{display:inline-flex; align-items:flex-start; gap:6px}
.sw-bar{width:16px; height:8px; border-radius:2px; background:var(--series-1); margin-top:.5em; flex:none}
.sw-dot{width:9px; height:9px; border-radius:50%; background:var(--series-2); margin-top:.45em; flex:none}
.leveldef{font-size:.86rem; color:var(--text-2); margin-top:6px}

/* ---------- 조작부 / controls ---------- */
.ctl{margin:0 0 14px}
.ctl:last-child{margin-bottom:0}
.ctl-label{display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:.9rem; margin-bottom:6px}
.ctl-label output{font-variant-numeric:tabular-nums; font-weight:600; color:var(--text)}
.seg{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:4px; background:var(--surface-2); padding:4px; border-radius:10px}
.seg.two{grid-template-columns:repeat(2, minmax(0,1fr))}
.seg button{border:0; background:transparent; color:var(--text-2); font:inherit; font-size:.85rem; line-height:1.25; padding:7px 4px; border-radius:7px; cursor:pointer; min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.12); font-weight:600}
@media (max-width:420px){ .seg:not(.two){grid-template-columns:repeat(2, minmax(0,1fr))} }
input[type=range]{width:100%; accent-color:var(--accent); height:28px; margin:0}
.btns{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.btn{border:1px solid var(--line); background:var(--surface); color:var(--text); font:inherit; font-size:.86rem; padding:7px 12px; border-radius:9px; cursor:pointer; min-height:38px}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.chk{display:inline-flex; align-items:center; gap:6px; font-size:.86rem; color:var(--text-2); cursor:pointer}
button:focus-visible, input:focus-visible, summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- 그래프 / plots ---------- */
.plot{position:relative; margin-bottom:10px}
.plot:last-of-type{margin-bottom:4px}
.plot-title{font-size:.88rem; color:var(--text-2); margin:0 0 2px}
.plot canvas{width:100%; height:150px; display:block; cursor:crosshair; touch-action:pan-y}
@media (max-width:600px){ .plot canvas{height:130px} }
.tip{position:absolute; pointer-events:none; background:var(--text); color:var(--bg); font-size:.76rem; padding:4px 7px; border-radius:6px; white-space:nowrap; transform:translate(-50%, -110%); opacity:0; transition:opacity .08s; font-variant-numeric:tabular-nums}
.xcap{font-size:.8rem; color:var(--muted); margin:2px 0 0}

/* ---------- 수치 타일 / stat tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin-top:14px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; min-width:0}
.tile .lab{font-size:.78rem; color:var(--text-2); line-height:1.3}
.tile .val{font-size:1.3rem; font-weight:650; font-variant-numeric:tabular-nums; margin-top:2px; overflow-wrap:anywhere}
.tile .sub{font-size:.76rem; color:var(--muted); font-variant-numeric:tabular-nums}

/* ---------- 본문 섹션 / text sections ---------- */
.text-sec{display:grid; gap:14px; grid-template-columns:minmax(0,1fr) minmax(0,1fr); margin-top:14px}
@media (max-width:880px){ .text-sec{grid-template-columns:minmax(0,1fr)} }
.eq-main{font-size:1.1rem; overflow-x:auto; padding:4px 0}
.eq-note{font-size:.8rem; color:var(--muted); margin:0 0 10px}
.eq-no{font-size:.78rem; color:var(--muted); text-align:right}
.ctl-label.plain{display:block}
.eq-sys{overflow-x:auto; background:var(--surface-2); border-radius:10px; padding:8px 10px; margin:4px 0 10px}
.eq-list{margin:0; padding-left:1.1em; font-size:.92rem}
.eq-list li{margin:4px 0; overflow-x:auto}
.explain p{margin:0 0 8px}
.src ul, .notes ul{margin:4px 0; padding-left:1.1em; font-size:.92rem}
.src li, .notes li{margin:5px 0}
details{margin-top:12px}
summary{cursor:pointer; color:var(--text-2); font-size:.9rem}
table{border-collapse:collapse; width:100%; font-size:.86rem; font-variant-numeric:tabular-nums; margin-top:6px}
th, td{border-bottom:1px solid var(--line); padding:4px 6px; text-align:right}
th:first-child, td:first-child{text-align:left}
footer{border-top:1px solid var(--line); margin-top:24px; padding:16px 0 36px; color:var(--muted); font-size:.82rem}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 상단: 허브 링크 + 언어 전환 ===== -->
  <header class="topbar">
    <a class="back bi-inline" href="../../" data-i18n="back"></a>
    <div class="lang" id="langToggle" role="group" aria-label="Language">
      <button type="button" data-set-lang="ko">한국어</button>
      <button type="button" data-set-lang="en">English</button>
      <button type="button" data-set-lang="both">한·EN</button>
    </div>
  </header>

  <!-- ===== 제목 · 한 줄 요약 ===== -->
  <div class="title">
    <span class="chip bi-inline" data-i18n="chipSec"></span>
    <h1 class="bi-sub" data-i18n="title"></h1>
    <p class="bi-block" data-i18n="summary"></p>
  </div>

  <!-- ===== 시뮬레이션 + 매개변수 ===== -->
  <div class="sim">
    <section class="panel p-levels" aria-labelledby="hLevels">
      <h2 id="hLevels" class="bi-inline" data-i18n="pLevels"></h2>
      <canvas id="levels" role="img" aria-label="Energy level diagram with occupation probabilities"></canvas>
      <div class="legend">
        <span class="key"><span class="sw-bar"></span><span class="bi-tight" data-i18n="legBar"></span></span>
        <span class="key"><span class="sw-dot"></span><span class="bi-tight" data-i18n="legDot"></span></span>
      </div>
      <div class="leveldef bi-block" id="levelDef"></div>
    </section>

    <section class="panel p-controls" aria-labelledby="hCtl">
      <h2 id="hCtl" class="bi-inline" data-i18n="pControls"></h2>

      <div class="ctl">
        <div class="ctl-label plain bi-inline" data-i18n="lblSystem"></div>
        <div class="seg" id="sysSeg" role="group">
          <button type="button" class="bi-tight" data-sys="two"  data-i18n="sysTwo"></button>
          <button type="button" class="bi-tight" data-sys="sho"  data-i18n="sysSho"></button>
          <button type="button" class="bi-tight" data-sys="nlev" data-i18n="sysNlev"></button>
          <button type="button" class="bi-tight" data-sys="rot"  data-i18n="sysRot"></button>
        </div>
      </div>

      <div class="ctl">
        <label class="ctl-label" for="tSlider"><span class="bi-inline" data-i18n="lblT"></span><output id="tOut"></output></label>
        <input type="range" id="tSlider" min="0" max="1000" step="1">
      </div>

      <div class="ctl" id="nCtl">
        <label class="ctl-label" for="nSlider"><span class="bi-inline" data-i18n="lblN"></span><output id="nOut"></output></label>
        <input type="range" id="nSlider" min="2" max="40" step="1">
      </div>

      <div class="ctl">
        <div class="ctl-label plain bi-inline" data-i18n="lblAxis"></div>
        <div class="seg two" id="axSeg" role="group">
          <button type="button" class="bi-inline" data-ax="lin" data-i18n="axLin"></button>
          <button type="button" class="bi-inline" data-ax="log" data-i18n="axLog"></button>
        </div>
      </div>

      <div class="ctl btns">
        <button type="button" class="btn primary bi-inline" id="sweepBtn" data-i18n="btnSweep"></button>
        <button type="button" class="btn bi-inline" id="resampleBtn" data-i18n="btnResample"></button>
        <label class="chk"><input type="checkbox" id="autoChk"><span class="bi-inline" data-i18n="chkResample"></span></label>
      </div>
    </section>

    <section class="panel p-plots" aria-labelledby="hPlots">
      <h2 id="hPlots" class="bi-inline" data-i18n="pPlots"></h2>
      <div class="plot" id="plotU"><p class="plot-title bi-inline" data-i18n="plotU"></p><canvas aria-label="U versus temperature"></canvas><div class="tip"></div></div>
      <div class="plot" id="plotS"><p class="plot-title bi-inline" data-i18n="plotS"></p><canvas aria-label="S versus temperature"></canvas><div class="tip"></div></div>
      <div class="plot" id="plotC"><p class="plot-title bi-inline" data-i18n="plotC"></p><canvas aria-label="C_V versus temperature"></canvas><div class="tip"></div></div>
      <p class="xcap bi-block" data-i18n="xCap"></p>
    </section>
  </div>

  <!-- ===== 현재 온도의 값 ===== -->
  <div class="tiles" aria-live="polite">
    <div class="tile"><div class="lab bi-tight" data-i18n="tileZ"></div><div class="val" id="vZ"></div><div class="sub" id="sZ"></div></div>
    <div class="tile"><div class="lab bi-tight" data-i18n="tileU"></div><div class="val" id="vU"></div></div>
    <div class="tile"><div class="lab bi-tight" data-i18n="tileS"></div><div class="val" id="vS"></div></div>
    <div class="tile"><div class="lab bi-tight" data-i18n="tileC"></div><div class="val" id="vC"></div></div>
    <div class="tile"><div class="lab bi-tight" data-i18n="tileP0"></div><div class="val" id="vP0"></div></div>
    <div class="tile"><div class="lab bi-tight" data-i18n="tileEbar"></div><div class="val" id="vEbar"></div><div class="sub bi-tight" id="sEbar"></div></div>
    <div class="tile"><div class="lab bi-tight" data-i18n="tileVar"></div><div class="val" id="vVar"></div><div class="sub bi-tight" id="sVar"></div></div>
  </div>

  <details>
    <summary class="bi-inline" data-i18n="tableSummary"></summary>
    <table>
      <thead><tr><th class="bi-tight" data-i18n="thLevel"></th><th data-i18n="thE"></th><th class="bi-tight" data-i18n="thG"></th><th class="bi-tight" data-i18n="thP"></th></tr></thead>
      <tbody id="levelTable"></tbody>
    </table>
  </details>

  <!-- ===== 핵심 수식 · 해설 · 교재 ===== -->
  <div class="text-sec">
    <section class="panel" aria-labelledby="hEq">
      <h2 id="hEq" class="bi-inline" data-i18n="hEq"></h2>
      <div class="eq-main">$$Z=\sum_{\alpha} e^{-\beta E_\alpha},\qquad \beta=\frac{1}{k_BT}$$$$U=-\frac{\partial \ln Z}{\partial \beta}$$</div>
      <p class="eq-note bi-inline" data-i18n="eqMainNote"></p>
      <div class="ctl-label plain bi-inline" data-i18n="hEqSys"></div>
      <div class="eq-sys" id="eqSys"></div>
      <div class="ctl-label plain bi-inline" data-i18n="hEqMore"></div>
      <ul class="eq-list">
        <li class="bi-block" data-i18n="eqS"></li>
        <li class="bi-block" data-i18n="eqC"></li>
        <li class="bi-block" data-i18n="eqFluc"></li>
      </ul>
    </section>

    <section class="panel explain" aria-labelledby="hExp">
      <h2 id="hExp" class="bi-inline" data-i18n="hExplain"></h2>
      <p class="bi-block" data-i18n="explain"></p>
    </section>

    <section class="panel src" aria-labelledby="hSrc">
      <h2 id="hSrc" class="bi-inline" data-i18n="hSource"></h2>
      <ul>
        <li class="bi-block" data-i18n="src1"></li>
        <li class="bi-block" data-i18n="src2"></li>
        <li class="bi-block" data-i18n="src3"></li>
      </ul>
    </section>

    <section class="panel notes" aria-labelledby="hNote">
      <h2 id="hNote" class="bi-inline" data-i18n="hNote"></h2>
      <ul>
        <li class="bi-block" data-i18n="note1"></li>
        <li class="bi-block" data-i18n="note2"></li>
        <li class="bi-block" data-i18n="note3"></li>
      </ul>
    </section>
  </div>

  <footer class="bi-block" id="footer"></footer>
</div>

<script>
/* #####################################################################
 * 데모 #2  분배함수: 네 가지 계  — 이 파일 하나로 동작합니다.
 * 구조: (1) 문구 사전 → (2) 언어 공통 코드 → (3) 물리 계산
 *       → (4) 캔버스 그래프 도구 → (5) 화면 갱신 → (6) 이벤트
 * 단위: 에너지는 Δ 단위, 온도는 t = k_BT/Δ, S·C_V는 k_B 단위.
 * ##################################################################### */

/* ===== (1) 문구 사전 / UI strings ===================================== */
const I18N = {
  ko: {
    back: '← 허브로',
    chipSec: '교재 20.1–20.3절',
    title: '분배함수: 네 가지 계',
    summary: '에너지 준위만 알면 분배함수 $Z$ 하나에서 내부에너지·엔트로피·열용량이 모두 나온다. 네 가지 계에서 온도를 바꾸며 확인해 보자.',
    pLevels: '에너지 준위와 점유 확률',
    legBar: '막대: 준위 확률 $P_j$ (정확값)',
    legDot: '점: 앙상블 복사본 100개의 표본',
    pControls: '매개변수',
    lblSystem: '계 선택',
    sysTwo: '2준위계', sysSho: '조화진동자', sysNlev: 'N준위계', sysRot: '회전자',
    lblT: '온도 $k_BT/\\Delta$',
    lblN: '준위 수 $N$',
    lblAxis: '그래프 가로축',
    axLin: '선형', axLog: '로그',
    btnSweep: '▶ 온도 훑기', btnStop: '■ 멈춤',
    btnResample: '다시 뽑기',
    chkResample: '계속 뽑기',
    defTwo: '준위 $E=\\pm\\Delta/2$ (축퇴 없음). 여기서 $\\Delta$는 두 준위의 간격이다.',
    defSho: '준위 $E_n=(n+\\tfrac12)\\hbar\\omega$, $n=0,1,2,\\dots$  여기서 $\\Delta\\equiv\\hbar\\omega$. 그림에는 아래 10개 준위만 보인다(나머지 확률은 맨 위에 표시).',
    defNlev: '준위 $E_j=j\\hbar\\omega$, $j=0,1,\\dots,N-1$. 여기서 $\\Delta\\equiv\\hbar\\omega$.',
    defRot: '준위 $E_J=\\Delta J(J+1)$, 축퇴도(겹침) $2J+1$. 여기서 $\\Delta\\equiv\\hbar^2/2I$. 그림에는 아래쪽 준위 몇 개만 보인다(나머지 확률은 맨 위에 표시).',
    pPlots: '온도에 따른 상태함수',
    plotU: '내부에너지 $U/\\Delta$', plotS: '엔트로피 $S/k_B$', plotC: '열용량 $C_V/k_B$',
    xCap: '가로축은 $k_BT/\\Delta$. 그래프를 누르면 그 온도로 이동한다. 점선은 극한값이다.',
    tileZ: '분배함수 $Z$', tileU: '내부에너지 $U/\\Delta$', tileS: '엔트로피 $S/k_B$', tileC: '열용량 $C_V/k_B$',
    tileP0: '바닥상태 확률 $P_0$',
    tileEbar: '표본 평균 $\\bar E/\\Delta$',
    tileVar: '에너지 요동 $\\langle(\\Delta E)^2\\rangle/\\Delta^2$',
    subEbar: '정확값 $U/\\Delta$ = {U}',
    subVar: '표본값 · 정확값 $k_BT^2C_V/\\Delta^2$ = {V}',
    tableSummary: '준위별 확률 표 보기',
    thLevel: '준위', thE: '$E/\\Delta$', thG: '축퇴도 $g$', thP: '확률 $P$',
    above: '그 위 준위 전체',

/* ===== (3) 물리 계산 / physics ======================================= *
 * 에너지 준위 목록 {E, g, label}을 만들고, 볼츠만 가중치로 열역학량을 구한다.
 *   Z = Σ g e^{-βE}            (20.1)
 *   U = Σ g E e^{-βE} / Z       (20.7) = -∂lnZ/∂β (20.9)
 *   S/k_B = ln Z + βU           (20.12)
 *   C_V/k_B = β²⟨(E-U)²⟩        (= ∂U/∂T, 요동-열용량 관계)
 * 수치 안정성을 위해 바닥 에너지 E0를 빼고 계산한다.                          */
const CUT = 45;                       // β(E-E0) 절단값
const SHOW = { two:2, sho:10, rot:8 };   // 계산에 최소로 포함할 준위 수
/* 그림에 그릴 준위 수: 회전자는 온도에 따라 3~8개 */
function nShowOf(sys, t, N){
  if (sys === 'nlev') return N;
  if (sys === 'rot') return 1 + Math.min(7, Math.max(3, Math.ceil(Math.sqrt(3 * t)) + 2));
  return SHOW[sys];
}

function levelsOf(sys, t, N){
  const L = [];
  if (sys === 'two') {
    L.push({E:-0.5, g:1, label:'−Δ/2'}, {E:0.5, g:1, label:'+Δ/2'});
  } else if (sys === 'sho') {
    const nmax = Math.max(SHOW.sho, Math.ceil(CUT * t) + 2);
    for (let n = 0; n <= nmax; n++) L.push({E:n + 0.5, g:1, label:'n='+n});
  } else if (sys === 'nlev') {
    for (let j = 0; j < N; j++) L.push({E:j, g:1, label:'j='+j});
  } else if (sys === 'rot') {
    const Jmax = Math.max(SHOW.rot, Math.ceil(Math.sqrt(CUT * t)) + 2);
    for (let J = 0; J <= Jmax; J++) L.push({E:J*(J+1), g:2*J+1, label:'J='+J});
  }
  return L;
}
function thermo(sys, t, N){
  const L = levelsOf(sys, t, N), b = 1 / t, E0 = L[0].E;
  let s = 0; const w = new Array(L.length);
  for (let i = 0; i < L.length; i++) { w[i] = L[i].g * Math.exp(-b * (L[i].E - E0)); s += w[i]; }
  let U = 0; for (let i = 0; i < L.length; i++) U += w[i] * L[i].E; U /= s;
  let v = 0; for (let i = 0; i < L.length; i++) { const d = L[i].E - U; v += w[i] * d * d; } v /= s;
  const lnZ = -b * E0 + Math.log(s);
  return { L, P: w.map(x => x / s), lnZ, U, S: lnZ + b * U, C: b * b * v, varE: v };
}
/* 극한값 / limiting values (점선) */
function refsOf(sys, N){
  if (sys === 'two')  return { U:[{y:-0.5, lab:'−1/2'},{y:0, lab:'0'}], S:[{y:Math.LN2, lab:'ln 2'}], C:[] };
  if (sys === 'sho')  return { U:[{fn:x => x, lab:'k_BT'}], S:[], C:[{y:1, lab:'1'}] };
  if (sys === 'nlev') return { U:[{y:(N-1)/2, lab:'(N−1)/2'}], S:[{y:Math.log(N), lab:'ln N'}], C:[] };
  return { U:[{fn:x => x, lab:'k_BT'}], S:[], C:[{y:1, lab:'1'}] };
}

/* ===== (4) 캔버스 그래프 도구 / small canvas plot helper ================= */
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function fmt(v, d = 3){
  if (!isFinite(v)) return '—';
  const a = Math.abs(v);
  if (a !== 0 && (a >= 1e5 || a < 1e-3)) {
    const e = Math.floor(Math.log10(a)), m = v / Math.pow(10, e);
    return `${m.toFixed(2)}×10<sup>${e}</sup>`;
  }
  return (a >= 100 ? v.toFixed(1) : a >= 10 ? v.toFixed(2) : v.toFixed(d));
}
function fmtPlain(v, d = 3){ return fmt(v, d).replace(/<sup>(.*?)<\/sup>/, '^$1'); }
function niceTicks(lo, hi, n = 4){
  const span = hi - lo, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n + 0.5);
  const out = []; for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
function setupCanvas(cv){
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const W = Math.max(1, Math.round(r.width)), H = Math.max(1, Math.round(r.height));
  if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, W, H };
}

class Plot {
  /* wrap: .plot 요소, getY: x → y (현재 계), onPick: x 선택 콜백 */
  constructor(wrap, key, onPick){
    this.wrap = wrap; this.cv = wrap.querySelector('canvas'); this.tip = wrap.querySelector('.tip');
    this.key = key; this.onPick = onPick; this.hoverX = null;
    this.pad = { l:44, r:14, t:8, b:20 };
    this.cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { this.hoverX = this.pxToX(e.offsetX); this.draw(); } });
    this.cv.addEventListener('pointerleave', () => { this.hoverX = null; this.draw(); });
    this.cv.addEventListener('click', e => { const x = this.pxToX(e.offsetX); if (x != null) this.onPick(x); });
  }
  set(d){ this.d = d; this.draw(); }
  xToPx(x){ const { xMin, xMax, xLog } = this.d, w = this.W - this.pad.l - this.pad.r;
    const f = xLog ? (Math.log(x) - Math.log(xMin)) / (Math.log(xMax) - Math.log(xMin)) : (x - xMin) / (xMax - xMin);
    return this.pad.l + f * w; }
  pxToX(px){ if (!this.d) return null; const { xMin, xMax, xLog } = this.d, w = this.W - this.pad.l - this.pad.r;
    let f = (px - this.pad.l) / w; if (f < 0 || f > 1) return null;
    return xLog ? Math.exp(Math.log(xMin) + f * (Math.log(xMax) - Math.log(xMin))) : xMin + f * (xMax - xMin); }
  yToPx(y){ const { yMin, yMax } = this.d, h = this.H - this.pad.t - this.pad.b;
    return this.pad.t + (1 - (y - yMin) / (yMax - yMin)) * h; }
  draw(){
    if (!this.d) return;
    const { ctx, W, H } = setupCanvas(this.cv); this.W = W; this.H = H;
    const d = this.d, p = this.pad;
    const cGrid = css('--grid'), cMuted = css('--muted'), cText2 = css('--text-2'), cS1 = css('--series-1'), cSurf = css('--surface');
    ctx.clearRect(0, 0, W, H);
    ctx.font = '11px ' + css('--font'); ctx.textBaseline = 'middle';
    /* 격자·눈금 */
    ctx.lineWidth = 1; ctx.strokeStyle = cGrid; ctx.fillStyle = cMuted;
    for (const y of niceTicks(d.yMin, d.yMax, 3)) {
      const py = Math.round(this.yToPx(y)) + .5; ctx.beginPath(); ctx.moveTo(p.l, py); ctx.lineTo(W - p.r, py); ctx.stroke();
      ctx.textAlign = 'right'; ctx.fillText(+y.toFixed(3), p.l - 6, py);
    }
    const xt = d.xLog ? [0.01, 0.1, 1, 10].filter(v => v >= d.xMin * 0.999 && v <= d.xMax * 1.001) : niceTicks(d.xMin, d.xMax, 5);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (const x of xt) { const px = Math.round(this.xToPx(x)) + .5;
      ctx.beginPath(); ctx.moveTo(px, p.t); ctx.lineTo(px, H - p.b); ctx.stroke(); ctx.fillText(String(x), px, H - p.b + 4); }
    /* 극한값 점선 */
    ctx.save(); ctx.beginPath(); ctx.rect(p.l, p.t, W - p.l - p.r, H - p.t - p.b); ctx.clip();
    ctx.setLineDash([4, 4]); ctx.strokeStyle = cMuted; ctx.lineWidth = 1.2;
    for (const r of d.refs) {
      ctx.beginPath();
      if (r.fn) { for (let i = 0; i <= 80; i++) { const x = d.xLog ? d.xMin * Math.pow(d.xMax / d.xMin, i / 80) : d.xMin + (d.xMax - d.xMin) * i / 80;
          const px = this.xToPx(x), py = this.yToPx(r.fn(x)); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } }
      else { const py = this.yToPx(r.y); ctx.moveTo(p.l, py); ctx.lineTo(W - p.r, py); }
      ctx.stroke();
    }
    ctx.setLineDash([]);
    /* 곡선 */
    ctx.strokeStyle = cS1; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.beginPath();
    d.xs.forEach((x, i) => { const px = this.xToPx(x), py = this.yToPx(d.ys[i]); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
    ctx.stroke(); ctx.restore();
    /* 극한값 라벨 (텍스트 색) */
    ctx.fillStyle = cText2; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    for (const r of d.refs) {
      const xr = d.xMax, yr = r.fn ? r.fn(xr) : r.y;
      if (yr >= d.yMin && yr <= d.yMax) ctx.fillText(r.lab, W - p.r - 2, this.yToPx(yr) - 2);
    }
    /* 현재 온도 표시 */
    if (d.marker) {
      const px = this.xToPx(d.marker.x), py = this.yToPx(d.marker.y);
      ctx.strokeStyle = cS1; ctx.globalAlpha = .35; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(px, p.t); ctx.lineTo(px, H - p.b); ctx.stroke(); ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(px, py, 5, 0, 2 * Math.PI); ctx.fillStyle = cS1; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = cSurf; ctx.stroke();
    }
    /* 마우스 십자선 + 툴팁 */
    if (this.hoverX != null) {
      const x = this.hoverX, y = d.getY(x), px = this.xToPx(x), py = this.yToPx(y);
      ctx.strokeStyle = cMuted; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(px + .5, p.t); ctx.lineTo(px + .5, H - p.b); ctx.stroke();
      ctx.beginPath(); ctx.arc(px, py, 4, 0, 2 * Math.PI); ctx.fillStyle = cS1; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = cSurf; ctx.stroke();
      this.tip.textContent = `k_BT/Δ = ${fmtPlain(x, 3)}   ${this.key} = ${fmtPlain(y, 3)}`;
      this.tip.style.left = Math.min(Math.max(px, 90), W - 90) + 'px';
      this.tip.style.top = (this.cv.offsetTop + Math.max(py, 26)) + 'px';
      this.tip.style.opacity = 1;
    } else this.tip.style.opacity = 0;
  }
}

/* ===== (5) 상태와 화면 갱신 / state & rendering ======================== */
const T_MIN = 0.02, T_MAX = 10, M = 100;        // 온도 범위, 앙상블 복사본 수
const state = { sys:'two', t:0.6, N:20, xLog:false, sample:[], sweeping:false };
const sliderToT = s => T_MIN * Math.pow(T_MAX / T_MIN, s / 1000);
const tToSlider = t => Math.round(1000 * Math.log(t / T_MIN) / Math.log(T_MAX / T_MIN));

let plots, curves = null;

/* 앙상블 표본: 현재 확률 분포에서 M개를 직접 뽑는다 */
function resample(th){
  const cdf = []; let c = 0; for (const p of th.P) { c += p; cdf.push(c); }
  state.sample = Array.from({length:M}, () => {
    const u = Math.random() * c; let i = cdf.findIndex(v => v >= u); if (i < 0) i = cdf.length - 1;
    return { i, jx: Math.random(), jy: Math.random() };
  });
}

/* 곡선은 계·N·축이 바뀔 때만 다시 계산 */
function buildCurves(){
  const n = 360, xs = [];
  const lo = state.xLog ? T_MIN : 0.01, hi = T_MAX;
  for (let i = 0; i <= n; i++) xs.push(state.xLog ? lo * Math.pow(hi / lo, i / n) : lo + (hi - lo) * i / n);
  const U = [], S = [], C = [];
  for (const x of xs) { const th = thermo(state.sys, x, state.N); U.push(th.U); S.push(th.S); C.push(th.C); }
  curves = { xs, U, S, C, xMin: state.xLog ? T_MIN : 0, xMax: T_MAX };
}
function range(arr, refs, xs){
  let lo = Math.min(...arr), hi = Math.max(...arr);
  for (const r of refs) { if (r.y != null) { lo = Math.min(lo, r.y); hi = Math.max(hi, r.y); } }
  const padv = (hi - lo) * 0.08 || 0.1; return [lo - padv, hi + padv];
}

function drawLevels(th){
  const cv = document.getElementById('levels'), { ctx, W, H } = setupCanvas(cv);
  const cLine = css('--muted'), cText2 = css('--text-2'), cS1 = css('--series-1'), cS2 = css('--series-2'), cSurf = css('--surface'), cGrid = css('--grid');
  ctx.clearRect(0, 0, W, H); ctx.font = '11px ' + css('--font');
  const nShow = nShowOf(state.sys, state.t, state.N);
  const Ls = th.L.slice(0, nShow);
  const Emin = Ls[0].E, Emax = Ls[Ls.length - 1].E, span = (Emax - Emin) || 1;
  /* 2준위계는 위아래 여백을 크게 둔다 */
  const vpad = state.sys === 'two' ? 0.22 * H : 0;
  const pad = { l:46, r:10, t:30 + vpad, b:16 + vpad };
  const yOf = E => pad.t + (1 - (E - Emin) / span) * (H - pad.t - pad.b);
  const xBar0 = pad.l + 6, barMax = (W - pad.l - pad.r) * 0.48;
  const xDot0 = xBar0 + barMax + 14, xDot1 = W - pad.r;
  const minGap = Ls.length > 1 ? Math.min(...Ls.slice(1).map((l, i) => yOf(Ls[i].E) - yOf(l.E))) : 40;
  const barH = Math.max(2, Math.min(12, minGap * 0.55));
  /* 세로 에너지 축 */
  ctx.strokeStyle = cGrid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(pad.l - .5, pad.t - 8); ctx.lineTo(pad.l - .5, H - pad.b + 4); ctx.stroke();
  ctx.fillStyle = cText2; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText('E/Δ', pad.l - 6, 10);
  const labelEvery = Math.max(1, Math.ceil(14 / Math.max(minGap, 1)));
  Ls.forEach((l, i) => {
    const y = Math.round(yOf(l.E)) + .5;
    ctx.strokeStyle = cLine; ctx.globalAlpha = .7; ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke(); ctx.globalAlpha = 1;
    if (i % labelEvery === 0) { ctx.fillStyle = cText2; ctx.fillText(+l.E.toFixed(2), pad.l - 6, y); }
    /* 확률 막대 (데이터 끝만 둥글게) */
    const w = th.P[i] * barMax;
    if (w > 0.4) {
      ctx.fillStyle = cS1; const r = Math.min(4, w / 2, barH / 2);
      ctx.beginPath(); ctx.moveTo(xBar0, y - barH / 2); ctx.lineTo(xBar0 + w - r, y - barH / 2);
      ctx.arcTo(xBar0 + w, y - barH / 2, xBar0 + w, y, r); ctx.arcTo(xBar0 + w, y + barH / 2, xBar0 + w - r, y + barH / 2, r);
      ctx.lineTo(xBar0, y + barH / 2); ctx.closePath(); ctx.fill();
    }
    if (minGap >= 24 && th.P[i] >= 0.0005) {
      ctx.fillStyle = cText2; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      const txt = 'P = ' + th.P[i].toFixed(3) + (l.g > 1 ? `   g = ${l.g}` : '');
      ctx.fillText(txt, xBar0, y - barH / 2 - 2); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    }
  });
  /* 그림 밖 (더 높은 준위) 확률 */
  const pAbove = th.P.slice(nShow).reduce((a, b) => a + b, 0);
  if (pAbove > 5e-4) { ctx.fillStyle = cText2; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(`↑ P(E > ${+Emax.toFixed(1)}) = ${pAbove.toFixed(3)}`, xBar0, 3); }
  /* 앙상블 표본 점 */
  ctx.lineWidth = 1.5;
  for (const s of state.sample) {
    let y, x = xDot0 + 6 + s.jx * (xDot1 - xDot0 - 12);
    if (s.i < nShow) y = yOf(th.L[s.i].E) + (s.jy - 0.5) * Math.min(8, minGap * 0.5);
    else y = pad.t - 12 + s.jy * 4;
    ctx.beginPath(); ctx.arc(x, y, 3.2, 0, 2 * Math.PI); ctx.fillStyle = cS2; ctx.fill(); ctx.strokeStyle = cSurf; ctx.stroke();
  }
}

function updateTiles(th){
  const Z = Math.exp(th.lnZ);
  setHTML(document.getElementById('vZ'), isFinite(Z) ? fmt(Z, 4) : `e<sup>${th.lnZ.toFixed(1)}</sup>`);
  document.getElementById('sZ').textContent = `ln Z = ${th.lnZ.toFixed(4)}`;
  document.getElementById('vU').innerHTML = fmt(th.U, 4);
  document.getElementById('vS').innerHTML = fmt(th.S, 4);
  document.getElementById('vC').innerHTML = fmt(th.C, 4);
  /* 바닥 '준위' 확률 (회전자는 J=0 한 상태) */
  document.getElementById('vP0').innerHTML = fmt(th.P[0], 4);
  const Es = state.sample.map(s => th.L[s.i].E);
  const mean = Es.reduce((a, b) => a + b, 0) / Es.length;
  const varS = Es.reduce((a, b) => a + (b - mean) * (b - mean), 0) / Es.length;
  document.getElementById('vEbar').innerHTML = fmt(mean, 3);
  setHTML(document.getElementById('sEbar'), biKey('subEbar', { U: fmtPlain(th.U, 4) }));
  document.getElementById('vVar').innerHTML = fmt(varS, 3);
  setHTML(document.getElementById('sVar'), biKey('subVar', { V: fmtPlain(state.t * state.t * th.C, 4) }));
  /* 준위 표 */
  const nShow = nShowOf(state.sys, state.t, state.N);
  const rows = th.L.slice(0, nShow).map((l, i) => `<tr><td>${l.label}</td><td>${+l.E.toFixed(3)}</td><td>${l.g}</td><td>${fmt(th.P[i], 4)}</td></tr>`);
  const pAbove = th.P.slice(nShow).reduce((a, b) => a + b, 0);
  if (th.L.length > nShow) rows.push(`<tr><td>${biKey('above')}</td><td>&gt; ${+th.L[nShow - 1].E.toFixed(2)}</td><td>—</td><td>${fmt(pAbove, 4)}</td></tr>`);
  document.getElementById('levelTable').innerHTML = rows.join('');
}

function updatePlots(th){
  const refs = refsOf(state.sys, state.N);
  const keys = { U:'U/Δ', S:'S/k_B', C:'C_V/k_B' };
  ['U', 'S', 'C'].forEach(k => {
    let [lo, hi] = range(curves[k], refs[k]);
    if (k !== 'U') lo = Math.min(lo, 0) - (k === 'C' ? 0.03 : 0.05);
    plots[k].set({
      xs: curves.xs, ys: curves[k], xMin: curves.xMin, xMax: curves.xMax, xLog: state.xLog,
      yMin: lo, yMax: hi, refs: refs[k], marker: { x: state.t, y: th[k] },
      getY: x => thermo(state.sys, Math.max(x, 1e-3), state.N)[k]
    });
  });
}

function render(full){
  const th = thermo(state.sys, state.t, state.N);
  if (full) {
    buildCurves();
    setHTML(document.getElementById('levelDef'), biKey({two:'defTwo', sho:'defSho', nlev:'defNlev', rot:'defRot'}[state.sys]));
    setHTML(document.getElementById('eqSys'), `$$${SYS_EQ[state.sys].tex}$$<div class="eq-no">${bi('교재 식 '+SYS_EQ[state.sys].no, 'Textbook Eq. '+SYS_EQ[state.sys].no)}</div>`);
    document.getElementById('nCtl').hidden = state.sys !== 'nlev';
    document.querySelectorAll('[data-sys]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sys === state.sys)));
    document.querySelectorAll('[data-ax]').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.ax === 'log') === state.xLog)));
  }
  if (full || !state.sample.length) resample(th);
  document.getElementById('tOut').textContent = state.t.toFixed(state.t < 0.1 ? 3 : 2);
  document.getElementById('nOut').textContent = state.N;
  drawLevels(th); updatePlots(th); updateTiles(th);
}

/* ===== (6) 이벤트 / events ========================================== */
function init(){
  const vars = { COURSE: CFG.COURSE, TERM: CFG.TERM };
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = biKey(el.dataset.i18n, vars); });
  setHTML(document.getElementById('footer'), biKey('footer', vars));

  const toggle = document.getElementById('langToggle');
  if (!CFG.SHOW_LANG_TOGGLE) toggle.hidden = true;
  toggle.addEventListener('click', e => { const b = e.target.closest('[data-set-lang]'); if (b) { setLang(b.dataset.setLang, true); render(false); } });
  setLang(resolveLang(), false);

  const tS = document.getElementById('tSlider'), nS = document.getElementById('nSlider');
  tS.value = tToSlider(state.t); nS.value = state.N;
  const pick = x => { state.t = Math.min(T_MAX, Math.max(T_MIN, x)); tS.value = tToSlider(state.t); state.sample = []; render(false); };
  plots = { U: new Plot(document.getElementById('plotU'), 'U/Δ', pick),
            S: new Plot(document.getElementById('plotS'), 'S/k_B', pick),
            C: new Plot(document.getElementById('plotC'), 'C_V/k_B', pick) };

  tS.addEventListener('input', () => { state.t = sliderToT(+tS.value); state.sample = []; render(false); });
  nS.addEventListener('input', () => { state.N = +nS.value; render(true); });
  document.getElementById('sysSeg').addEventListener('click', e => { const b = e.target.closest('[data-sys]'); if (b) { state.sys = b.dataset.sys; render(true); } });
  document.getElementById('axSeg').addEventListener('click', e => { const b = e.target.closest('[data-ax]'); if (b) { state.xLog = b.dataset.ax === 'log'; render(true); } });
  document.getElementById('resampleBtn').addEventListener('click', () => { state.sample = []; render(false); });

  /* 앙상블 계속 뽑기 (움직임 줄이기 설정이면 기본 꺼짐) */
  const auto = document.getElementById('autoChk'); let timer = null;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  auto.checked = !reduce;
  const setAuto = () => { clearInterval(timer); if (auto.checked) timer = setInterval(() => { state.sample = []; render(false); }, 900); };
  auto.addEventListener('change', setAuto); setAuto();

  /* 온도 훑기 애니메이션 */
  const sweep = document.getElementById('sweepBtn'); let raf = null;
  const setSweepLabel = () => { sweep.innerHTML = biKey(state.sweeping ? 'btnStop' : 'btnSweep'); };
  sweep.addEventListener('click', () => {
    state.sweeping = !state.sweeping; setSweepLabel();
    if (state.sweeping) {
      if (+tS.value >= 995) tS.value = 0;
      const step = () => {
        if (!state.sweeping) return;
        tS.value = Math.min(1000, +tS.value + 3); state.t = sliderToT(+tS.value); render(false);
        if (+tS.value >= 1000) { state.sweeping = false; setSweepLabel(); return; }
        raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
    } else cancelAnimationFrame(raf);
  });

  /* 크기·테마 변화 시 다시 그리기 */
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => render(false), 80); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render(false));

  renderMath(document.body);
  render(true);
}
document.addEventListener('DOMContentLoaded', init);
</script>
