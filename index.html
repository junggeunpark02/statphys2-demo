  GITHUB_USER:'GITHUB_USER', REPO_NAME:'REPO_NAME', BRANCH:'main', NOTEBOOK_DIR:'notebooks',
  COURSE:{ko:'열및통계물리2', en:'Thermal and Statistical Physics 2'},
  TERM:{ko:'2026-2학기', en:'Fall Semester 2026'}, ORG:{ko:'', en:''}
}, window.SITE_CONFIG || {});
const LANGS = ['ko','en','both'];
const LS_KEY = 'statphys2-lang';

function resolveLang(){
  if (!CFG.SHOW_LANG_TOGGLE) return LANGS.includes(CFG.DEFAULT_LANG) ? CFG.DEFAULT_LANG : 'both';
  const q = new URLSearchParams(location.search).get('lang');
  if (LANGS.includes(q)) return q;
  try { const s = localStorage.getItem(LS_KEY); if (LANGS.includes(s)) return s; } catch(e){}
  return LANGS.includes(CFG.DEFAULT_LANG) ? CFG.DEFAULT_LANG : 'both';
}
/* 한·영 문자열 쌍을 언어별 span 두 개로 만든다 */
function bi(ko, en){
  if (ko == null) ko = en; if (en == null) en = ko;
  return `<span class="t-ko" lang="ko">${ko}</span><span class="t-en" lang="en">${en}</span>`;
}
function biKey(key, vars){
  const sub = (s, l) => s == null ? s : s.replace(/\{(\w+)\}/g, (m,k)=> vars && vars[k] ? vars[k][l] : m);
  return bi(sub(I18N.ko[key],'ko'), sub(I18N.en[key],'en'));
}
function setLang(lang, save){
  document.documentElement.dataset.lang = lang;
  document.documentElement.lang = (lang === 'en') ? 'en' : 'ko';
  document.querySelectorAll('[data-set-lang]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.setLang === lang)));
  if (save) { try { localStorage.setItem(LS_KEY, lang); } catch(e){} }
}
function renderMath(root){
  if (window.renderMathInElement) {
    renderMathInElement(root, {delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false});
  }
}
function texInline(tex){
  if (window.katex) { try { return katex.renderToString(tex, {throwOnError:false}); } catch(e){} }
  return `<code>${tex}</code>`;
}

/* =====================================================================
 * 5) 페이지 구성 / build page
 * ===================================================================== */
function colabURL(file){
  return `https://colab.research.google.com/github/${CFG.GITHUB_USER}/${CFG.REPO_NAME}/blob/${CFG.BRANCH}/${CFG.NOTEBOOK_DIR}/${file}`;
}
function build(){
  const vars = { COURSE: CFG.COURSE };
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = biKey(el.dataset.i18n, vars); });
  document.getElementById('brand').innerHTML = bi(CFG.COURSE.ko, CFG.COURSE.en);
  const orgK = CFG.ORG && CFG.ORG.ko ? ` · ${CFG.ORG.ko}` : '', orgE = CFG.ORG && CFG.ORG.en ? ` · ${CFG.ORG.en}` : '';
  document.getElementById('term').innerHTML = bi(CFG.TERM.ko + orgK, CFG.TERM.en + orgE);
  document.getElementById('ref2').innerHTML = bi(
    `${CFG.COURSE.ko} ${I18N.ko.ref2}, ${CFG.TERM.ko}${orgK}.`,
    `${CFG.COURSE.en}, ${I18N.en.ref2}, ${CFG.TERM.en}${orgE}.`);

  const cards = document.getElementById('cards');
  cards.innerHTML = DEMOS.map(d => `
    <article class="card ${d.ready ? 'ready' : ''}">
      <div class="meta">
        <span class="bi-slash">#${d.id} · ${bi('교재 '+d.sec+'절', 'Sec. '+d.sec)}</span>
        <span class="chip bi-slash ${d.ready ? 'ok' : ''}">${d.ready ? biKey('ready') : biKey('soon')}</span>
      </div>
      <h3 class="bi-sub">${bi(d.title.ko, d.title.en)}</h3>
      <div class="eq">${texInline(d.eq)}</div>
      <p class="desc bi-block">${bi(d.desc.ko, d.desc.en)}</p>
      <a class="go bi-inline" href="${d.ready ? d.path : '#'}" ${d.ready ? '' : 'aria-disabled="true" tabindex="-1"'}>${d.ready ? biKey('open') : biKey('soon')}</a>
    </article>`).join('');

  const nb = document.getElementById('notebooks');
  nb.innerHTML = NOTEBOOKS.map(n => `
    <div class="nb-row">
      <div class="ch bi-slash">${bi(n.ch+'장', 'Ch. '+n.ch)}</div>
      <div>
        <div class="t bi-inline">${bi(n.title.ko, n.title.en)}</div>
        <div class="ex bi-slash">${biKey('examples')} ${n.ex}${n.extra ? ' · '+biKey('extra')+' '+n.extra : ''}</div>
      </div>
      <div class="badge-wrap">
        <a class="badge ${n.ready ? '' : 'off'}" href="${n.ready ? colabURL(n.file) : '#'}" target="_blank" rel="noopener"
           ${n.ready ? '' : 'aria-disabled="true" tabindex="-1"'} title="${n.file}">
          <img src="https://colab.research.google.com/assets/colab-badge.svg" alt="Open In Colab">
        </a>
        ${n.ready ? '' : `<span class="bi-slash">${biKey('nbSoon')}</span>`}
      </div>
    </div>`).join('');

  const toggle = document.getElementById('langToggle');
  if (!CFG.SHOW_LANG_TOGGLE) toggle.hidden = true;
  toggle.addEventListener('click', e => {
    const b = e.target.closest('[data-set-lang]'); if (b) setLang(b.dataset.setLang, true);
  });
  setLang(resolveLang(), false);
  renderMath(document.body);
}
/* KaTeX(defer)가 로드된 뒤 구성 */
document.addEventListener('DOMContentLoaded', build);
</script>
</body>
</html>
